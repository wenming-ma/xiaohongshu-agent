[project]
name = "xiaohongshu-agent"
version = "0.2.0"
description = "Xiaohongshu content creation agent powered by Pydantic-AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # pydantic-ai（官方 PyPI 包）
    "pydantic-ai",
    # LLM Provider
    "anthropic>=0.80.0",
    "google-genai>=1.0.0",
    # 其他依赖
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.13.2",
    "python-dotenv>=1.2.1",
    "httpx>=0.27.0",
    "tenacity>=8.0.0",
    "opentelemetry-api>=1.0.0",
    # Logfire（可观测性）
    "logfire>=2.0.0",
    # Prompt 管理
    "pyyaml>=6.0.0",
    # 图片压缩
    "Pillow>=10.0.0",
    "openai>=2.14.0",
    # Telegram Bot
    "aiogram>=3.0.0",
    "mistralai>=1.9.11",
    "numpy>=2.4.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "yt-dlp>=2026.2.4",
    "faster-whisper>=1.2.1",
    "huggingface-hub>=1.4.1",
    "playwright>=1.58.0",
    "nvidia-cublas-cu12>=12.8.4.1",
    "lark-oapi>=1.5.3",
    "pycryptodome>=3.23.0",
    "requests-toolbelt>=1.0.0",
    "jieba>=0.42.1",
    "griffe>=2.0.0",
    "trafilatura>=2.0.0",
    "scipy>=1.17.1",
    "audio-separator==0.43.1",
    "onnxruntime-gpu>=1.24.0",
    # 固定 CUDA 版 Torch，确保 audio-separator 可启用 GPU
    "torch==2.8.0+cu128",
    "torchvision==0.23.0+cu128",
    "torchaudio==2.8.0+cu128",
]

[project.scripts]
xhs-agent = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
