[project]
name = "xiaohongshu-agent"
version = "0.2.0"
description = "Xiaohongshu content creation agent powered by Pydantic-AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # pydantic-ai（官方 PyPI 包）
    "pydantic-ai",
    # LLM Provider
    "anthropic>=0.80.0",
    "google-genai>=1.0.0",
    # 其他依赖
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.13.2",
    "python-dotenv>=1.2.1",
    "httpx>=0.27.0",
    "tenacity>=8.0.0",
    "opentelemetry-api>=1.0.0",
    # Logfire（可观测性）
    "logfire>=2.0.0",
    # Prompt 管理
    "pyyaml>=6.0.0",
    # 图片压缩
    "Pillow>=10.0.0",
    "openai>=2.14.0",
    # Telegram Bot
    "aiogram>=3.0.0",
    "mistralai>=1.9.11",
    "numpy>=2.4.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "yt-dlp>=2026.2.4",
    "faster-whisper>=1.2.1",
    "huggingface-hub>=1.4.1",
    "playwright>=1.58.0",
    "nvidia-cublas-cu12>=12.9.1.4",
    "lark-oapi>=1.5.3",
    "pycryptodome>=3.23.0",
    "requests-toolbelt>=1.0.0",
    "jieba>=0.42.1",
    "griffe>=2.0.0",
]

[project.scripts]
xhs-agent = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
